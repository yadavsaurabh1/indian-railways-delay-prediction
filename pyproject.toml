[project]
name = "indian-railways-model"
version = "0.1.0"
description = "Delay prediction for Indian Railways trains using network-wide running history"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub>=0.34",
    "polars>=1.20",
    "pyarrow>=17",
    "numpy>=2.0",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "holidays>=0.108",
]

[tool.uv]
package = false
